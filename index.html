<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <meta name="description" content="Procvičování otázek k odborné způsobilosti pro zbrojní oprávnění.">
  <title>Zbrojní oprávnění - procvičování otázek</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="site-header">
      <div class="brand-mark" aria-hidden="true">ZO</div>
      <div>
        <h1>Zbrojní oprávnění</h1>
        <p class="subtitle">Procvičování otázek</p>
      </div>
      <div class="header-buttons">
        <button id="replay-button" class="header-button" aria-label="Restartovat"><span aria-hidden="true">⟳</span></button>
      </div>
    </header>

    <section id="loading" class="panel status-panel" aria-live="polite">Načítám otázky…</section>

    <section id="quiz" hidden>
      <div class="progress-row">
        <span id="progress-label">Otázka 1 z 837</span>
        <span id="score-label">Správně: 0</span>
      </div>
      <div class="progress-track" aria-hidden="true"><div id="progress-bar" class="progress-bar"></div></div>

      <article class="panel question-panel">
        <div class="question-number" id="question-number">Otázka č. 1</div>
        <div id="question-images" class="question-images" hidden></div>
        <h2 id="question-text" class="question-text"></h2>
        <div id="answers" class="answers" role="group" aria-label="Možnosti odpovědi"></div>
        <div class="actions">
          <button id="next-button" class="primary-button" type="button" disabled>Další otázka <span aria-hidden="true">→</span></button>
        </div>
      </article>
      <p class="footer-note">
        <span id="version-label">Verze: 1.</span>
        <span>Zdroj: <a href="https://mv.gov.cz/zbrojni-opravneni">https://mv.gov.cz/zbrojni-opravneni</a></span>
      </p>
    </section>

    <section id="results" class="panel results-panel" hidden aria-live="polite">
      <div class="result-icon" aria-hidden="true">✓</div>
      <h2>Hotovo!</h2>
      <p id="results-summary"></p>
      <button id="restart-button" class="primary-button" type="button">Procvičovat znovu</button>
    </section>
  </main>
</body>
</html>
