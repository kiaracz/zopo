<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <meta name="description" content="Procvičování otázek k odborné způsobilosti pro zbrojní oprávnění.">
  <title>Zbrojní oprávnění - procvičování otázek</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="site-header">
      <div class="brand-mark">ZO</div>
      <div>
        <h1>Zbrojní oprávnění</h1>
        <p class="subtitle">Procvičování otázek</p>
      </div>
      <div class="header-buttons">
        <button id="replay-button" class="header-button"><span title="Restart">↺</span></button>
      </div>
    </header>

    <section id="loading" class="panel status-panel">Načítám otázky…</section>

    <section id="quiz" hidden>
      <article class="panel question-panel">
        <div class="question-number" id="question-number">Otázka 1 z 837</div>
        <div id="question-images" class="question-images" hidden></div>
        <h2 id="question-text" class="question-text"></h2>
        <div id="answers" class="answers" role="group"></div>
        <div class="actions">
          <button id="next-button" class="primary-button" type="button" disabled>Další otázka →</button>
        </div>
      </article>
      <p class="footer-note">Zdroj: <a href="https://mv.gov.cz/zbrojni-opravneni">https://mv.gov.cz/zbrojni-opravneni</a></p>
    </section>

    <section id="results" class="panel results-panel" hidden>
      <div class="result-icon">✓</div>
      <h2>Hotovo!</h2>
      <button id="restart-button" class="primary-button" type="button">Procvičovat znovu</button>
    </section>
  </main>
  <dialog id="replay-dialog" class="panel">
    <div class="question-text">↺ Začít odznova?</div>
    <div class="replay-buttons">
      <button id="replay-button-yes" class="replay-button" type="button">Ano</button>
      <button id="replay-button-no" class="replay-button" type="button">Ne</button>
    </div>
  </dialog>
</body>
</html>
