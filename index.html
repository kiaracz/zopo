<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <meta name="description" content="Procvičování otázek k odborné způsobilosti pro zbrojní oprávnění.">
  <title>Zbrojní oprávnění - procvičování otázek</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="site-header">
      <div class="brand-mark">ZO</div>
      <div>
        <h1>Zbrojní oprávnění</h1>
        <p class="subtitle">Procvičování otázek</p>
      </div>
      <div class="actions">
        <button id="first-button" class="secondary-button" type="button"><span title="První otázka">⏮</span></button>
        <button id="rew-button" class="secondary-button" type="button" disabled>⏪︎</button>
        <button id="prev-button" class="primary-button" type="button" disabled><span title="Předchozí otázka">◀</span></button>
        <button id="next-button" class="primary-button" type="button" disabled><span title="Další otázka">▶</span></button>
        <button id="ffw-button" class="secondary-button" type="button" disabled>⏩︎</button>
        <button id="last-button" class="secondary-button" type="button"><span title="Poslední otázka">⏭</span></button>
      </div>
    </header>

    <section id="loading" class="panel status-panel">Načítám otázky…</section>

    <section id="quiz" hidden>
      <article class="panel question-panel">
        <div id="question-images" class="question-images" hidden></div>
        <h2 id="question-text" class="question-text"></h2>
        <div id="answers" class="answers" role="group"></div>
      </article>
      <footer>Zdroj: <a href="https://mv.gov.cz/zbrojni-opravneni">https://mv.gov.cz/zbrojni-opravneni</a></footer>
    </section>
  </main>
</body>
</html>
